<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Simple Page</title>
    <style>
        /* This is CSS to make the page look nice */
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            text-align: center;
            padding: 50px;
        }
        .container {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            max-width: 600px;
            margin: auto;
        }
        button {
            background-color: #007BFF;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome to My Website</h1>
        
        <p>This is a simple HTML page created from scratch.</p>
        
        <h3>Things I like:</h3>
        <ul>
            <li>Coding</li>
            <li>Coffee</li>
            <li>Web Design</li>
        </ul>

        <p>Click the button below to see an alert:</p>
        <button onclick="alert('Hello! You clicked the button.')">Click Me</button>
    </div>

</body>
</html>
